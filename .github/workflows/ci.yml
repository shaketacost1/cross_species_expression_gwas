name: CI - test Shiny app

on:
  push:
    branches: [ main, project-alpha-clean ]
  pull_request:
    branches: [ main, project-alpha-clean ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_shiny/requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium

      - name: Start Shiny app
        # start the app in background on port 8000
        run: |
          export PORT=8000
          # Run in background and capture PID
          nohup python python_shiny/python_app.py --port $PORT &> server_ci.log & echo $! > server_ci.pid
          # wait for server to respond
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:${PORT}/ >/dev/null; then
              echo "server up"
              break
            fi
            sleep 1
          done

      - name: Run tests
        env:
          REGLAND_TEST_URL: http://127.0.0.1:8000
        run: |
          python -m pytest -q python_shiny/tests/test_smoke_playwright.py::test_smoke_all_charts -q -s

      - name: Save server log on failure
        if: failure()
        run: |
          echo "==== SERVER LOG ===="
          cat server_ci.log || true
