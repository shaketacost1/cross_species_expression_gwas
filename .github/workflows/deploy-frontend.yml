name: Deploy Frontend

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  IMAGE_NAME: frontend-app
  CONTAINER_NAME: frontend-app
  PORT: 80

jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Generate image tag
        id: meta
        run: |
          echo "IMAGE_TAG=${IMAGE_NAME}:$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "LATEST_TAG=${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT

      - name: Build Docker image
        working-directory: ./frontend
        run: |
          docker build \
            --tag ${{ steps.meta.outputs.IMAGE_TAG }} \
            --tag ${{ steps.meta.outputs.LATEST_TAG }} \
            --cache-from ${{ env.IMAGE_NAME }}:latest \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .

      - name: Test image
        run: |
          # Quick smoke test to ensure image starts correctly
          docker run --rm -d --name test-container -p 8080:80 ${{ steps.meta.outputs.LATEST_TAG }}
          sleep 5
          curl -f http://localhost:8080 || exit 1
          docker stop test-container

      - name: Stop existing container
        run: |
          if docker ps -q -f name=${{ env.CONTAINER_NAME }}; then
            echo "Stopping existing container..."
            docker stop ${{ env.CONTAINER_NAME }}
          fi
        continue-on-error: true

      - name: Remove existing container
        run: |
          if docker ps -aq -f name=${{ env.CONTAINER_NAME }}; then
            echo "Removing existing container..."
            docker rm ${{ env.CONTAINER_NAME }}
          fi
        continue-on-error: true

      - name: Deploy new container
        run: |
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --restart unless-stopped \
            -p ${{ env.PORT }}:80 \
            --health-cmd="wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1" \
            --health-interval=30s \
            --health-timeout=3s \
            --health-retries=3 \
            ${{ steps.meta.outputs.LATEST_TAG }}

      - name: Verify deployment
        run: |
          echo "Waiting for container to be healthy..."
          timeout 60s bash -c 'until docker inspect --format="{{.State.Health.Status}}" ${{ env.CONTAINER_NAME }} | grep -q healthy; do sleep 2; done'
          echo "✅ Container is healthy"
          
          echo "Testing endpoint..."
          sleep 5
          curl -f http://localhost:${{ env.PORT }} || exit 1
          echo "✅ Deployment successful"

      - name: Cleanup old images
        run: |
          # Keep only the 3 most recent images
          docker images ${{ env.IMAGE_NAME }} --format "table {{.Repository}}:{{.Tag}}\t{{.CreatedAt}}" | \
          tail -n +2 | sort -k2 -r | tail -n +4 | awk '{print $1}' | xargs -r docker rmi || true
        continue-on-error: true

      - name: Show container status
        if: always()
        run: |
          echo "=== Container Status ==="
          docker ps -f name=${{ env.CONTAINER_NAME }}
          echo "=== Container Logs (last 20 lines) ==="
          docker logs --tail 20 ${{ env.CONTAINER_NAME }} || true